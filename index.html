<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광탈출 | 관리자 현황</title><style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
*{box-sizing:border-box}body{margin:0;background:#f2f8f7;color:#11313b;font-family:Pretendard Variable,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:48px 20px}header{padding:38px;border-radius:24px;background:linear-gradient(130deg,#092f3c,#176b61);color:white;box-shadow:0 18px 45px #062e3a35}.tag{font-size:11px;font-weight:800;letter-spacing:.15em;color:#9be5d8}h1{margin:10px 0;font-size:clamp(30px,5vw,48px);letter-spacing:-.06em}header p{margin:0;color:#d0ebe6;line-height:1.6}.panel{margin-top:20px;padding:24px;border:1px solid #d8e8e5;border-radius:18px;background:white}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top b{font-size:18px}.top small{display:block;margin-top:5px;color:#70868d}.top input{padding:11px;border:1px solid #d4e1df;border-radius:10px;font:inherit;color:#12313b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.kpis article{padding:17px;border-radius:14px;background:#f1f8f6}.kpis small{display:block;color:#59737a;font-weight:700}.kpis strong{display:block;margin:7px 0 2px;font-size:29px;color:#0c6359}.bars{display:grid;gap:8px;margin-top:18px}.row{display:grid;grid-template-columns:55px 1fr 40px;align-items:center;gap:10px;font-size:12px}.bar{height:10px;overflow:hidden;border-radius:99px;background:#e9f2f0}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#35bfa8,#ff906d)}.note{margin-top:22px;padding:15px;border-radius:12px;background:#fff7e9;color:#785829;font-size:13px;line-height:1.6}a{color:#087669;font-weight:800}@media(max-width:720px){.wrap{padding:20px 14px}.kpis{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header><span class="tag">GWANGTALCHUL · OPEN DASHBOARD</span><h1>관리자 홈페이지</h1><p>개인 위치·개인식별정보 없이, 선택 날짜의 시간대별 익명 집계만 확인합니다.</p></header><section class="panel"><div class="top"><div><b>운영 현황</b><small id="updated">불러오는 중…</small></div><input id="date" type="date"></div><div class="kpis"><article><small>접속 이용자</small><strong id="visitors">—</strong><span>명</span></article><article><small>도착 기록</small><strong id="arrivals">—</strong><span>건</span></article><article><small>출발 기록</small><strong id="departures">—</strong><span>건</span></article><article><small>최다 기록 시간</small><strong id="peak">—</strong><span id="peakcount">—</span></article></div><h2>30분 단위 현황</h2><div class="bars" id="bars"></div><p class="note">이 화면은 공개 링크용 운영 현황입니다. 공개 API에서 제공되는 익명 합계만 표시하며, 기록의 의미와 최신 집계 방식은 이용자 사이트의 안내를 함께 확인해 주세요.</p></section></main><script>
const API='https://gwangtalchul-crowd-guide.workspace-925535.chatgpt.site/api/visits';const $=id=>document.getElementById(id);const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const time=s=>`${String(Math.floor(s/2)).padStart(2,'0')}:${s%2?'30':'00'}`;$('date').value=iso(new Date());
async function load(){const date=$('date').value;try{const r=await fetch(`${API}?date=${date}`,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),a=d.arrival||Array(48).fill(0),p=d.departure||Array(48).fill(0),rows=a.map((v,i)=>({i,a:v,p:p[i]||0,total:v+(p[i]||0)})),max=Math.max(1,...rows.map(x=>x.total)),top=[...rows].sort((x,y)=>y.total-x.total)[0];$('visitors').textContent=(d.visitors||0).toLocaleString();$('arrivals').textContent=a.reduce((x,y)=>x+y,0).toLocaleString();$('departures').textContent=p.reduce((x,y)=>x+y,0).toLocaleString();$('peak').textContent=top.total?time(top.i):'—';$('peakcount').textContent=top.total?`${top.total}건`:'기록 없음';$('bars').innerHTML=rows.map(x=>`<div class="row"><span>${time(x.i)}</span><div class="bar"><i style="width:${x.total/max*100}%"></i></div><b>${x.total}</b></div>`).join('');$('updated').textContent=`${new Date().toLocaleTimeString('ko-KR')} 갱신 · 30초마다 자동 업데이트`;}catch{$('updated').textContent='정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}$('date').addEventListener('change',load);load();setInterval(load,30000);
</script></body></html>
